# ── Basics ────────────────────────────────────────────────────────────
set-environment -g PATH "/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin"
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB,ghostty:RGB"
set -g history-limit 100000
set -g escape-time 10
set -g status-interval 5
set -g focus-events on
set -g mouse on
setw -g mode-keys vi
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on
set -g set-titles-string "#S / #W"

# ── Reload config ─────────────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display-message "config reloaded"

# ── Splits abrem na pasta atual ───────────────────────────────────────
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window   -c "#{pane_current_path}"

# ── Vim-style pane navigation ─────────────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind -n S-Left  previous-window
bind -n S-Right next-window

# ── Vi copy-mode (com pbcopy do macOS) ────────────────────────────────
bind -T copy-mode-vi v   send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y   send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# ── Catppuccin Frappé ─────────────────────────────────────────────────
set -g @catppuccin_flavor 'frappe'
set -g @catppuccin_status_background "#{@thm_bg}"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_text "#W"
set -g @catppuccin_window_current_text "#W"

# Status bar separators (U+E0B6 = left rounded cap, U+E0B4 = right rounded cap)
set -g @catppuccin_status_left_separator ""
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_connect_separator "no"

set -g @catppuccin_directory_text " #{b:pane_current_path} "
set -g @catppuccin_session_text " #S "
set -g @catppuccin_date_time_text " %d/%m %H:%M "

source-file ~/.config/tmux/plugins/catppuccin/tmux/catppuccin_options_tmux.conf
source-file ~/.config/tmux/plugins/catppuccin/tmux/catppuccin_tmux.conf

# ── Status bar ────────────────────────────────────────────────────────
set -g status-right-length 200
set -g status-left-length 100
set -g status-left ""
set -g   status-right "#{E:@catppuccin_status_user}"
set -ag  status-right "  "
set -agF status-right "#{E:@catppuccin_status_host}"
set -ag  status-right "  "
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag  status-right "  "
set -agF status-right "#{E:@catppuccin_status_ram}"
set -ag  status-right "  "
set -agF status-right "#{E:@catppuccin_status_battery}"
set -ag  status-right "  "
set -agF status-right "#{E:@catppuccin_status_date_time}"
set -ag  status-right "  "
set -ag  status-right "#{E:@catppuccin_status_directory}"
set -ag  status-right "  "
set -ag  status-right "#{E:@catppuccin_status_session}"

# ── Plugins de sistema (correm após status-right estar definido) ───────
run ~/.config/tmux/plugins/tmux-cpu/cpu.tmux
run ~/.config/tmux/plugins/tmux-battery/battery.tmux
